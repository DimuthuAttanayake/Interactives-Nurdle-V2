# Builds the story and publishes it to GitHub Pages on every push to main.
# Nothing built is committed — Pages serves the folder this job produces, so
# build/ stays gitignored and the repo holds source only.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-run a deploy by hand from the Actions tab
  workflow_dispatch:

# what the Pages deployment needs to be allowed to do
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the earlier one finish instead of
# cancelling it — a half-finished deploy would take the live site down.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
